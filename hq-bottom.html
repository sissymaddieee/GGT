<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Girl Training HQ 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --hot-pink: #FF69B4;
            --soft-pink: #FFB6D9;
            --baby-pink: #FFC9E3;
            --red: #FF1744;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #FFE5F0 0%, #FFB6D9 50%, #FF94C8 100%);
            padding: 1rem;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '✨';
            position: fixed;
            top: 10%;
            left: 5%;
            font-size: 2rem;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '💖';
            position: fixed;
            top: 20%;
            right: 8%;
            font-size: 2.5rem;
            opacity: 0.3;
            animation: float 7s ease-in-out infinite 1s;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .title {
            font-family: 'Pacifico', cursive;
            font-size: 1.8rem;
            color: var(--hot-pink);
            margin-bottom: 0.3rem;
            line-height: 1.4;
            text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2);
            animation: headerBounce 2.5s ease-in-out infinite;
        }
        @keyframes headerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .subtitle {
            font-size: 0.95rem;
            color: var(--hot-pink);
            font-weight: 600;
        }
        .quote {
            font-family: 'Pacifico', cursive;
            font-size: 1rem;
            color: var(--hot-pink);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .section {
            background: white;
            border: 3px solid var(--hot-pink);
            border-radius: 15px;
            padding: 1.2rem;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            margin-bottom: 2rem;
        }
        .section-title {
            font-family: 'Pacifico', cursive;
            font-size: 1.3rem;
            color: var(--hot-pink);
            margin-bottom: 0.8rem;
            text-align: center;
        }
        .section-title::first-letter {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .divider {
            height: 3px;
            background: white;
            margin: 2rem 0;
            border-radius: 10px;
        }
        .row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .row-full {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .protocol-box {
            background: rgba(255, 182, 217, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            border-left: 3px solid var(--hot-pink);
            margin-bottom: 0.6rem;
        }
        .protocol-label {
            font-size: 0.8rem;
            color: var(--hot-pink);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        .protocol-items {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.8;
            font-weight: 500;
        }
        .protocol-items li {
            margin-bottom: 0.4rem;
        }
        .protocol-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.15) 0%, rgba(255, 201, 227, 0.15) 100%);
            padding: 0.8rem;
            border-radius: 10px;
            border-left: 3px solid var(--hot-pink);
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--hot-pink);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        .stat-value {
            font-size: 1.3rem;
            color: var(--hot-pink);
            font-weight: 700;
        }
        .mantra-display {
            background: white;
            border: 2px solid var(--baby-pink);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .mantra-text {
            font-family: 'Pacifico', cursive;
            font-size: 1.3rem;
            color: #FF1493;
            line-height: 1.5;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, var(--hot-pink) 0%, #FF1493 100%);
            border: none;
            color: white;
            padding: 0.7rem 1.3rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            margin: 0 0.4rem;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .quiz-input {
            margin-top: 1rem;
            padding: 0.8rem;
            border: 2px solid var(--hot-pink);
            border-radius: 10px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: var(--hot-pink);
            background: rgba(255, 182, 217, 0.1);
            width: 100%;
        }
        .quiz-input::placeholder {
            color: rgba(255, 105, 180, 0.5);
        }
        .quiz-input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
            background: white;
        }
        .quiz-feedback {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }
        .correct {
            color: #4CAF50;
        }
        .incorrect {
            color: #FF1744;
        }
        .bow {
            text-align: center;
            font-size: 2rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .tag-filter-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            border: 2px solid #ccc;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Quicksand';
        }
        .tag-filter-btn.active {
            background: var(--hot-pink);
            border-color: var(--hot-pink);
            color: white;
        }
        .tag-filter-btn[data-filter="encouragedbi"] { color: #FF1744; }
        .tag-filter-btn[data-filter="encouragedbi"].active { background: #FF1744; border-color: #FF1744; }
        .tag-filter-btn[data-filter="sissy"] { color: #FF69B4; }
        .tag-filter-btn[data-filter="sissy"].active { background: #FF69B4; border-color: #FF69B4; }
        .tag-filter-btn[data-filter="gooning"] { color: #9C27B0; }
        .tag-filter-btn[data-filter="gooning"].active { background: #9C27B0; border-color: #9C27B0; }
        .tag-filter-btn[data-filter="cei"] { color: #FF6F00; }
        .tag-filter-btn[data-filter="cei"].active { background: #FF6F00; border-color: #FF6F00; }
        .tag-filter-btn[data-filter="throat"] { color: #E91E63; }
        .tag-filter-btn[data-filter="throat"].active { background: #E91E63; border-color: #E91E63; }
        .tag-filter-btn[data-filter="chastity"] { color: #4CAF50; }
        .tag-filter-btn[data-filter="chastity"].active { background: #4CAF50; border-color: #4CAF50; }
        .tag-filter-btn[data-filter="anal"] { color: #FF5722; }
        .tag-filter-btn[data-filter="anal"].active { background: #FF5722; border-color: #FF5722; }
        .tag-filter-btn[data-filter="obedience"] { color: #2196F3; }
        .tag-filter-btn[data-filter="obedience"].active { background: #2196F3; border-color: #2196F3; }
        .month-header {
            background: linear-gradient(135deg, var(--hot-pink) 0%, #FF1493 100%);
            color: white;
            padding: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            user-select: none;
        }
        .month-header:hover { transform: translateX(5px); }
        .month-header.collapsed { background: linear-gradient(135deg, var(--soft-pink) 0%, #FFB6D9 100%); }
        .month-header i { transition: transform 0.3s; }
        .month-header.collapsed i { transform: rotate(-90deg); }
        .blackmail-items {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-left: 1rem;
            border-left: 3px solid var(--hot-pink);
            margin-left: 0.5rem;
        }
        .blackmail-item {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--hot-pink);
            border-radius: 10px;
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .blackmail-item:hover { background: rgba(255, 255, 255, 0.9); box-shadow: 0 2px 8px rgba(255, 105, 180, 0.2); }
        .blackmail-title { font-weight: 600; color: #333; }
        .blackmail-link {
            background: var(--hot-pink);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .blackmail-link:hover { opacity: 0.9; }
        .clip-card {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--hot-pink);
            border-radius: 12px;
            padding: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s;
        }
        .clip-card:hover { background: rgba(255, 255, 255, 0.9); box-shadow: 0 2px 8px rgba(255, 105, 180, 0.2); }
        .clip-info { flex: 1; min-width: 0; }
        .clip-title { font-weight: 600; font-size: 0.95rem; margin: 0 0 0.25rem; color: #333; }
        .clip-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        .tag-badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 500;
            color: white;
        }
        .tag-badge.encouragedbi { background: #FF1744; }
        .tag-badge.sissy { background: #FF69B4; }
        .tag-badge.gooning { background: #9C27B0; }
        .tag-badge.cei { background: #FF6F00; }
        .tag-badge.throat { background: #E91E63; }
        .tag-badge.chastity { background: #4CAF50; }
        .tag-badge.anal { background: #FF5722; }
        .tag-badge.obedience { background: #2196F3; }
        .tag-badge.other { background: #999; }
        .clip-actions {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }
        .clip-btn {
            background: none;
            border: 1px solid var(--hot-pink);
            color: var(--hot-pink);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            font-weight: 500;
        }
        .clip-btn:hover { background: var(--hot-pink); color: white; }
        .clip-btn.active { background: var(--hot-pink); color: white; }
        .clip-link {
            background: var(--hot-pink);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .clip-link:hover { opacity: 0.9; }
        .click-count { font-size: 0.7rem; color: var(--hot-pink); font-weight: 600; }

        /* TILE WALL */
        #clipsList.tile-wall {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.6rem;
        }
        .clip-tile {
            position: relative;
            aspect-ratio: 16 / 11;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            border: 2px solid transparent;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .clip-tile:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--hot-pink);
            box-shadow: 0 8px 18px rgba(255, 105, 180, 0.35);
        }
        .clip-tile::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0) 100%);
        }
        .tile-body {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 0.5rem 0.6rem;
            z-index: 1;
        }
        .tile-title {
            color: white; font-weight: 700; font-size: 0.85rem; line-height: 1.2;
            margin: 0 0 0.3rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .tile-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .tile-tags .tag-badge { font-size: 0.6rem; padding: 0.15rem 0.45rem; }
        .tile-flags {
            position: absolute; top: 0.4rem; right: 0.4rem; z-index: 1;
            display: flex; gap: 0.25rem;
        }
        .tile-flag {
            background: rgba(255,255,255,0.9); border-radius: 50%;
            width: 22px; height: 22px; font-size: 0.7rem;
            display: flex; align-items: center; justify-content: center;
        }
        .tile-plays {
            position: absolute; top: 0.4rem; left: 0.4rem; z-index: 1;
            background: rgba(0,0,0,0.55); color: white;
            font-size: 0.65rem; font-weight: 700;
            padding: 0.15rem 0.45rem; border-radius: 20px;
        }
        .tile-play {
            position: absolute; top: 50%; left: 50%; z-index: 1;
            transform: translate(-50%, -60%) scale(0.7);
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--hot-pink); color: white; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: all 0.2s;
        }
        .clip-tile:hover .tile-play { opacity: 1; transform: translate(-50%, -60%) scale(1); }
        /* COVER FLOW */
        #clipsList.coverflow-wrap { display: block !important; }
        .coverflow {
            position: relative; height: 260px;
            perspective: 900px; overflow: hidden;
            outline: none; user-select: none; touch-action: pan-y;
        }
        .cf-item {
            position: absolute; top: 18px; left: 50%;
            width: 190px; height: 190px; margin-left: -95px;
            border-radius: 6px; cursor: pointer;
            background-size: cover; background-position: center;
            transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.45s, filter 0.45s;
            box-shadow: 0 10px 22px rgba(0,0,0,0.35);
            -webkit-box-reflect: below 4px linear-gradient(transparent 60%, rgba(255,255,255,0.25));
        }
        .cf-item.center { cursor: default; box-shadow: 0 14px 30px rgba(255,105,180,0.5); }
        .cf-item .tile-flags { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; }
        .cf-item .cf-label {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 0.4rem 0.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
            color: white; font-size: 0.7rem; font-weight: 700; line-height: 1.15;
            border-radius: 0 0 6px 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .cf-item:not(.center) .cf-label { opacity: 0; }
        .cf-label { transition: opacity 0.3s; }
        .cf-arrow {
            position: absolute; top: 100px; z-index: 500;
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.9); color: var(--hot-pink);
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .cf-arrow.left { left: 4px; } .cf-arrow.right { right: 4px; }
        .cf-info { text-align: center; margin-top: 0.5rem; }
        .cf-title { font-weight: 700; font-size: 1rem; color: #333; margin: 0 0 0.3rem; }
        .cf-meta { display: flex; justify-content: center; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .cf-count { font-size: 0.7rem; color: var(--hot-pink); font-weight: 600; margin-top: 0.4rem; }
        .cf-slider { width: 100%; accent-color: var(--hot-pink); margin-top: 0.4rem; }
        .cf-date {
            position: absolute; top: 6px; left: 6px;
            background: rgba(0,0,0,0.55); color: white;
            font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 20px;
        }
        .hashtag { cursor: pointer; }
        .hashtag:hover { filter: brightness(1.1); text-decoration: underline; }
        .cf-empty { text-align: center; color: var(--hot-pink); padding: 2rem 0; }
        /* LIGHTBOX */
        .lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(20, 0, 15, 0.85);
            display: none; align-items: center; justify-content: center; flex-direction: column;
            padding: 1rem;
        }
        .lightbox.open { display: flex; }
        .lb-media { max-width: 100%; max-height: calc(100vh - 6rem); display: flex; justify-content: center; }
        .lb-media img, .lb-media video {
            max-width: 100%; max-height: calc(100vh - 6rem);
            border-radius: 10px; border: 3px solid var(--hot-pink); background: black;
        }
        .lb-media iframe {
            width: min(900px, 92vw); height: min(560px, calc(100vh - 6rem));
            border: 3px solid var(--hot-pink); border-radius: 10px; background: black;
        }
        .lb-bar { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.6rem; color: white; font-weight: 700; }
        .lb-bar button, .lb-bar a {
            background: var(--hot-pink); color: white; border: none; border-radius: 6px;
            padding: 0.35rem 0.8rem; font-weight: 700; font-family: 'Quicksand'; cursor: pointer;
            text-decoration: none; font-size: 0.85rem;
        }
        .lb-close {
            position: absolute; top: 0.6rem; right: 0.8rem;
            background: none; border: none; color: white; font-size: 2rem; cursor: pointer;
        }
        /* SEARCH + DROPDOWN */
        .clip-search-wrap { position: relative; margin-bottom: 0.6rem; }
        .clip-search-wrap input {
            width: 100%; padding: 0.5rem 2.4rem 0.5rem 0.6rem;
            border: 2px solid #FF69B4; border-radius: 8px;
            font-family: 'Quicksand'; font-size: 0.9rem; outline: none;
        }
        .clip-search-wrap.open input { border-radius: 8px 8px 0 0; }
        #clipMenuToggle {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
            border: none; background: none; color: #FF69B4; font-size: 1.1rem;
            cursor: pointer; padding: 0.2rem 0.5rem; transition: transform 0.2s;
        }
        .clip-search-wrap.open #clipMenuToggle { transform: translateY(-50%) rotate(180deg); }
        .clip-menu {
            display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 1000;
            max-height: 260px; overflow-y: auto;
            background: white; border: 2px solid #FF69B4; border-top: none;
            border-radius: 0 0 8px 8px; box-shadow: 0 8px 18px rgba(255,105,180,0.25);
        }
        .clip-search-wrap.open .clip-menu { display: block; }
        .clip-menu-item {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.4rem 0.6rem; cursor: pointer; border-bottom: 1px solid #ffe0ef;
        }
        .clip-menu-item:last-child { border-bottom: none; }
        .clip-menu-item:hover, .clip-menu-item.active { background: #ffe8f3; }
        .clip-menu-title { font-weight: 600; font-size: 0.85rem; color: #333; }
        .clip-menu-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; justify-content: flex-end; }
        .clip-menu-tags .tag-badge { font-size: 0.6rem; padding: 0.1rem 0.45rem; }
        .clip-menu-empty { padding: 0.6rem; color: #FF69B4; text-align: center; font-size: 0.85rem; }
        /* COMPLETED / INCOMPLETE TOGGLE */
        .lib-toggle {
            display: flex; background: #ffe8f3; border: 2px solid #FF69B4; border-radius: 10px;
            padding: 3px; gap: 3px; margin-bottom: 0.5rem;
        }
        .lib-toggle button {
            flex: 1; border: none; background: none; border-radius: 7px; padding: 0.4rem;
            font-family: 'Quicksand'; font-weight: 700; font-size: 0.85rem; color: #FF69B4; cursor: pointer;
        }
        .lib-toggle button.active { background: #FF69B4; color: white; }
        .lib-toggle span { opacity: 0.75; font-weight: 600; }
        .todo-list { display: flex; flex-direction: column; gap: 0.4rem; max-height: 420px; overflow-y: auto; padding-right: 2px; }
        .todo-item {
            display: flex; align-items: center; justify-content: space-between; gap: 0.6rem;
            border: 2px solid #ffd0e6; border-radius: 10px; padding: 0.45rem 0.6rem; background: white;
        }
        .todo-item:hover { border-color: #FF69B4; }
        .todo-title { font-weight: 700; font-size: 0.9rem; color: #333; margin-bottom: 0.2rem; }
        .todo-tags { display: flex; gap: 0.25rem; flex-wrap: wrap; }
        .todo-tags .tag-badge { font-size: 0.6rem; padding: 0.1rem 0.45rem; }
        .todo-item .clip-link { white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <!-- WHITE DIVIDER -->
        <div class="divider"></div>
        <div class="row-2col">
            <div class="section" id="blackmailPanel">
                <div class="section-title">🖼️ Blackmail</div>
                <div id="blackmailSection" style="display: none;">
                    <div style="margin-bottom: 0.6rem; font-size: 0.85rem; color: #FF69B4; font-weight: 600;">
                        <span id="bmCount">0</span> total | <span id="bmMonths">0</span> months
                    </div>
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.6rem;">
                        <input type="text" id="bmSearch" placeholder="Search a name, month or year (oct, 2026)" style="flex: 1; min-width: 0; padding: 0.5rem; border: 2px solid #FF69B4; border-radius: 8px; font-family: 'Quicksand'; font-size: 0.9rem;">
                    </div>
                    <div id="blackmailList" class="coverflow-wrap"></div>
                </div>
                <div id="blackmailLoading" style="text-align: center; color: #FF69B4;">Loading...</div>
            </div>
            <div class="section" id="libraryPanel">
                <div class="section-title">📚 Library</div>
                <div id="librarySection" style="display: none;">
                    <div style="margin-bottom: 0.6rem; font-size: 0.85rem; color: #FF69B4; font-weight: 600;">
                        <span id="clipCount">0</span> total clips | <span id="categoryCount">0</span> categories
                    </div>
                    
                    <div class="lib-toggle" id="libToggle">
                        <button type="button" class="active" data-mode="album">💿 Completed <span id="doneCount"></span></button>
                        <button type="button" data-mode="todo">📌 Incomplete <span id="todoCount"></span></button>
                    </div>
                    <div class="clip-search-wrap" id="clipSearchWrap">
                        <input type="text" id="clipSearch" autocomplete="off" placeholder="Search a name or #hashtag (#sissy #fav)">
                        <button type="button" id="clipMenuToggle" aria-label="Show clips">▾</button>
                        <div class="clip-menu" id="clipMenu" role="listbox"></div>
                    </div>

                    
                    <div id="clipsList" class="coverflow-wrap"></div>
                </div>
                <div id="libraryLoading" style="text-align: center; color: #FF69B4;">Loading library...</div>
            </div>
        </div>
        <!-- BOW -->
        <div class="bow">🎀</div>
    </div>

    <script>
        // LIBRARY
        let clips = [];
        let clipStats = {};

        async function loadLibrary() {
            try {
                const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_U4ZElEgkBkgv6jP20hJICA3lCqlWli4EezWccqE7F3JksP5F0qg9_OClPU6MaW1fawjHX5Gr7ZXs/pub?gid=192779347&single=true&output=csv';
                const response = await fetch(csvUrl);
                const csv = await response.text();
                const lines = csv.trim().split('\n');
                
                clips = [];
                let categories = new Set();
                
                lines.forEach((line, idx) => {
                    if (idx === 0 || !line.trim()) return;
                    
                    const parts = line.split(',');
                    if (parts.length >= 2) {
                        const title = (parts[0] || '').trim();
                        const link = (parts[1] || '').trim();
                        const tag1 = (parts[2] || '').trim();
                        const tag2 = (parts[3] || '').trim();
                        const notes = (parts[4] || '').trim();
                        const image = (parts[5] || '').trim();

                        if (title && link) {
                            const tags = [];
                            if (tag1) {
                                tags.push(tag1);
                                categories.add(tag1);
                            }
                            if (tag2) {
                                tags.push(tag2);
                                categories.add(tag2);
                            }
                            
                            clips.push({ title, link, tags, notes, image });
                            if (!clipStats[title]) {
                                clipStats[title] = { clicks: 0, favorite: false, incomplete: false };
                            }
                        }
                    }
                });
                
                loadClipStats();
                filterAndRenderLibrary();
                
                document.getElementById('libraryLoading').style.display = 'none';
                document.getElementById('librarySection').style.display = 'block';
                document.getElementById('clipCount').textContent = clips.length;
                document.getElementById('categoryCount').textContent = categories.size;
                
                document.getElementById('clipSearch').addEventListener('input', filterAndRenderLibrary);
                setupClipMenu();
                document.querySelectorAll('#libToggle button').forEach(b => b.onclick = () => setLibMode(b.dataset.mode));

                document.querySelectorAll('.tag-filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.tag-filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentTagFilter = e.target.dataset.filter;
                        filterAndRenderLibrary();
                    });
                });
                
            } catch (e) {
                console.log('Library error:', e);
            }
        }

        function saveClipStats() {
            localStorage.setItem('ggcClipStats', JSON.stringify(clipStats));
        }

        function loadClipStats() {
            const saved = localStorage.getItem('ggcClipStats');
            if (saved) {
                clipStats = JSON.parse(saved);
            }
        }

        function getTagClass(tag) {
            const t = tag.trim();
            if (t === 'EncouragedBi') return 'encouragedbi';
            if (t === 'Sissy') return 'sissy';
            if (t === 'Gooning') return 'gooning';
            if (t === 'CEI') return 'cei';
            if (t === 'Throat Training') return 'throat';
            if (t === 'Chastity') return 'chastity';
            if (t === 'Anal Training') return 'anal';
            if (t === 'Obedience Training') return 'obedience';
            return 'other';
        }

        let currentTagFilter = 'incomplete';

        function tagSlug(tag) {
            return tag.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        let libMode = 'album'; // 'album' = completed clips as albums, 'todo' = incomplete clips as a list
        const isIncomplete = clip => clip.notes.toLowerCase().includes('incomplete');

        function setLibMode(mode) {
            libMode = mode;
            document.querySelectorAll('#libToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            closeClipMenu();
            document.getElementById('clipMenuToggle').style.display = mode === 'album' ? '' : 'none';
            filterAndRenderLibrary();
        }

        function filterAndRenderLibrary() {
            const query = document.getElementById('clipSearch').value.toLowerCase().trim();
            const words = query.split(/\s+/).filter(Boolean);
            const hashtags = words.filter(w => w.startsWith('#') && w.length > 1).map(w => w.slice(1).replace(/[^a-z0-9]/g, ''));
            const text = words.filter(w => !w.startsWith('#')).join(' ');

            let filtered = clips.filter(clip => {
                const notes = clip.notes.toLowerCase();
                const slugs = clip.tags.map(tagSlug);
                const matchesText = !text ||
                    clip.title.toLowerCase().includes(text) ||
                    slugs.some(t => t.includes(text.replace(/[^a-z0-9]/g, '')));
                const matchesTags = hashtags.every(h => {
                    if ('favorite'.startsWith(h) || h === 'fav' || h === 'favourite') return notes.includes('favorite');
                    if ('incomplete'.startsWith(h) && h.length >= 3) return notes.includes('incomplete');
                    return slugs.some(t => t.startsWith(h));
                });
                return matchesText && matchesTags;
            });

            filtered.sort((a, b) => a.title.localeCompare(b.title));

            const todo = clips.filter(isIncomplete).length;
            document.getElementById('todoCount').textContent = todo;
            document.getElementById('doneCount').textContent = clips.length - todo;

            if (libMode === 'todo') {
                renderTodoList(filtered.filter(isIncomplete));
            } else {
                renderLibrary(filtered.filter(c => !isIncomplete(c)));
                renderClipMenu();
            }
        }

        function addHashtag(tag) {
            const box = document.getElementById('clipSearch');
            const h = '#' + tag;
            if (!box.value.toLowerCase().split(/\s+/).includes(h)) box.value = (box.value.trim() + ' ' + h).trim();
            filterAndRenderLibrary();
        }

        const TAG_DOTS = {
            encouragedbi: '🔴', sissy: '🩷', gooning: '🟣', cei: '🟠',
            throat: '🟥', chastity: '🟢', anal: '🟧', obedience: '🔵', other: '⚪'
        };

        const TAG_COLORS = {
            encouragedbi: '#FF1744', sissy: '#FF69B4', gooning: '#9C27B0', cei: '#FF6F00',
            throat: '#E91E63', chastity: '#4CAF50', anal: '#FF5722', obedience: '#2196F3', other: '#999999'
        };

        function hashString(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
            return h >>> 0;
        }

        // Unique, stable cover for clips without an image
        function generatedCover(clip) {
            const h = hashString(clip.title);
            const c1 = TAG_COLORS[getTagClass(clip.tags[0] || '')] || '#FF69B4';
            const c2 = TAG_COLORS[getTagClass(clip.tags[1] || clip.tags[0] || '')] || '#9C27B0';
            const angle = h % 360;
            const x1 = (h >>> 3) % 100, y1 = (h >>> 9) % 100;
            const x2 = (h >>> 15) % 100, y2 = (h >>> 21) % 100;
            return `radial-gradient(circle at ${x1}% ${y1}%, rgba(255,255,255,0.45) 0, rgba(255,255,255,0) 35%),
                    radial-gradient(circle at ${x2}% ${y2}%, ${c2}cc 0, ${c2}00 55%),
                    linear-gradient(${angle}deg, ${c1}, ${c2})`;
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        let cfIndex = 0;
        let cfClips = [];

        function coverStyle(clip) {
            const cover = generatedCover(clip);
            return clip.image ? `url("${clip.image.replace(/"/g, '%22')}"), ${cover}` : cover;
        }

        function renderTodoList(items) {
            const list = document.getElementById('clipsList');
            if (!items.length) {
                list.innerHTML = '<div class="cf-empty">Nothing incomplete 🎉</div>';
                return;
            }
            list.innerHTML = '<div class="todo-list">' + items.map(c => `
                <div class="todo-item">
                    <div class="todo-info">
                        <div class="todo-title">${escapeHTML(c.title)}</div>
                        <div class="todo-tags">${c.tags.map(t => `<span class="tag-badge ${getTagClass(t)}">${escapeHTML(t)}</span>`).join('')}</div>
                    </div>
                    <a href="${c.link}" class="clip-link" target="_blank" rel="noopener" data-title="${escapeHTML(c.title)}">▶ Watch</a>
                </div>`).join('') + '</div>';
            list.querySelectorAll('.todo-item .clip-link').forEach(a => a.onclick = () => recordClick(a.dataset.title));
        }

        function renderLibrary(clipsToRender) {
            const list = document.getElementById('clipsList');
            const prevTitle = cfClips[cfIndex]?.title;
            cfClips = clipsToRender;
            const keep = cfClips.findIndex(c => c.title === prevTitle);
            cfIndex = keep >= 0 ? keep : 0;

            if (!cfClips.length) {
                list.innerHTML = '<div class="cf-empty">No clips match.</div>';
                return;
            }

            list.innerHTML = `
                <div class="coverflow" id="coverflow" tabindex="0">
                    <button class="cf-arrow left" id="cfPrev" aria-label="Previous">‹</button>
                    <button class="cf-arrow right" id="cfNext" aria-label="Next">›</button>
                </div>
                <input type="range" class="cf-slider" id="cfSlider" min="0" max="${cfClips.length - 1}" value="${cfIndex}">
                <div class="cf-info" id="cfInfo"></div>
            `;

            const flow = document.getElementById('coverflow');
            cfClips.forEach((clip, i) => {
                const notes = clip.notes.toLowerCase();
                const item = document.createElement('div');
                item.className = 'cf-item';
                item.style.backgroundImage = coverStyle(clip);
                item.innerHTML = `
                    <div class="tile-flags">
                        ${notes.includes('favorite') ? '<span class="tile-flag">❤️</span>' : ''}
                        ${notes.includes('incomplete') ? '<span class="tile-flag">📌</span>' : ''}
                    </div>
                    ${clip.image ? '' : `<div class="cf-label">${escapeHTML(clip.title)}</div>`}
                `;
                item.addEventListener('click', () => {
                    if (i === cfIndex) { recordClick(clip.title); window.open(clip.link, '_blank', 'noopener'); }
                    else setCoverIndex(i);
                });
                flow.appendChild(item);
            });

            document.getElementById('cfPrev').onclick = () => setCoverIndex(cfIndex - 1);
            document.getElementById('cfNext').onclick = () => setCoverIndex(cfIndex + 1);
            document.getElementById('cfSlider').oninput = e => setCoverIndex(+e.target.value);

            flow.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') { setCoverIndex(cfIndex - 1); e.preventDefault(); }
                if (e.key === 'ArrowRight') { setCoverIndex(cfIndex + 1); e.preventDefault(); }
                if (e.key === 'Enter') flow.querySelector('.cf-item.center')?.click();
            });

            let wheelLock = false;
            flow.addEventListener('wheel', e => {
                const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                if (Math.abs(d) < 4) return;
                e.preventDefault();
                if (wheelLock) return;
                wheelLock = true;
                setCoverIndex(cfIndex + (d > 0 ? 1 : -1));
                setTimeout(() => wheelLock = false, 140);
            }, { passive: false });

            let startX = null;
            flow.addEventListener('pointerdown', e => { startX = e.clientX; });
            flow.addEventListener('pointerup', e => {
                if (startX === null) return;
                const dx = e.clientX - startX;
                if (Math.abs(dx) > 30) setCoverIndex(cfIndex - Math.round(dx / 60));
                startX = null;
            });

            layoutCoverflow();
        }

        // Spins the cover flow to a clip; clears the search first if it's hidden by it
        function jumpToClip(title) {
            if (!cfClips.some(c => c.title === title)) {
                document.getElementById('clipSearch').value = '';
                filterAndRenderLibrary();
            }
            const i = cfClips.findIndex(c => c.title === title);
            if (i >= 0) { setCoverIndex(i); document.getElementById('coverflow').focus(); }
        }

        // SEARCH DROPDOWN: lists only the clips matching the search; picking one spins the albums to it
        let menuActive = -1;

        function renderClipMenu() {
            const menu = document.getElementById('clipMenu');
            if (!menu) return;
            if (!cfClips.length) {
                menu.innerHTML = '<div class="clip-menu-empty">No clips match.</div>';
                menuActive = -1;
                return;
            }
            menu.innerHTML = cfClips.map((c, i) => `
                <div class="clip-menu-item ${i === menuActive ? 'active' : ''}" role="option" data-i="${i}">
                    <span class="clip-menu-title">${escapeHTML(c.title)}</span>
                    <span class="clip-menu-tags">${c.tags.map(t => `<span class="tag-badge ${getTagClass(t)}">${escapeHTML(t)}</span>`).join('')}</span>
                </div>`).join('');
            menu.querySelectorAll('.clip-menu-item').forEach(el => {
                el.addEventListener('mousedown', e => {
                    e.preventDefault();
                    pickFromMenu(+el.dataset.i);
                });
            });
        }

        function openClipMenu() {
            if (libMode !== 'album') return;
            menuActive = -1;
            renderClipMenu();
            document.getElementById('clipSearchWrap').classList.add('open');
        }

        function closeClipMenu() {
            document.getElementById('clipSearchWrap').classList.remove('open');
            menuActive = -1;
        }

        function pickFromMenu(i) {
            if (i < 0 || i >= cfClips.length) return;
            setCoverIndex(i);
            closeClipMenu();
            document.getElementById('clipSearch').blur();
        }

        function setupClipMenu() {
            const input = document.getElementById('clipSearch');
            const wrap = document.getElementById('clipSearchWrap');
            input.addEventListener('focus', openClipMenu);
            input.addEventListener('input', () => { if (!wrap.classList.contains('open')) openClipMenu(); });
            input.addEventListener('blur', () => setTimeout(closeClipMenu, 120));
            document.getElementById('clipMenuToggle').addEventListener('mousedown', e => {
                e.preventDefault();
                if (wrap.classList.contains('open')) { closeClipMenu(); input.blur(); }
                else { input.focus(); }
            });
            input.addEventListener('keydown', e => {
                if (libMode !== 'album') return;
                if (!wrap.classList.contains('open')) openClipMenu();
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const n = cfClips.length;
                    if (!n) return;
                    menuActive = e.key === 'ArrowDown' ? (menuActive + 1) % n : (menuActive - 1 + n) % n;
                    renderClipMenu();
                    document.querySelector('#clipMenu .clip-menu-item.active')?.scrollIntoView({ block: 'nearest' });
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    pickFromMenu(menuActive >= 0 ? menuActive : 0);
                } else if (e.key === 'Escape') {
                    closeClipMenu();
                    input.blur();
                }
            });
        }

        function setCoverIndex(i) {
            const n = Math.max(0, Math.min(cfClips.length - 1, i));
            if (n === cfIndex) return;
            cfIndex = n;
            layoutCoverflow();
        }

        function positionFlowItems(items, center) {
            items.forEach((item, i) => {
                const off = i - center;
                const abs = Math.abs(off);
                item.classList.toggle('center', off === 0);
                item.style.opacity = abs > 6 ? 0 : 1;
                item.style.pointerEvents = abs > 6 ? 'none' : 'auto';
                const x = off === 0 ? 0 : Math.sign(off) * (110 + (abs - 1) * 45);
                const rot = off === 0 ? 0 : -Math.sign(off) * 55;
                const z = off === 0 ? 60 : -40 - abs * 10;
                item.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg)`;
                item.style.zIndex = 100 - abs;
                item.style.filter = off === 0 ? 'none' : `brightness(${Math.max(0.45, 0.85 - abs * 0.08)})`;
            });
        }

        function layoutCoverflow() {
            positionFlowItems(document.querySelectorAll('#coverflow .cf-item'), cfIndex);

            const slider = document.getElementById('cfSlider');
            if (slider) slider.value = cfIndex;

            const clip = cfClips[cfIndex];
            const stats = clipStats[clip.title] || { clicks: 0 };
            const notesL = clip.notes.toLowerCase();
            const allTags = clip.tags.map(t => ({ slug: tagSlug(t), cls: getTagClass(t) }));
            if (notesL.includes('favorite')) allTags.push({ slug: 'favorite', cls: 'other' });
            if (notesL.includes('incomplete')) allTags.push({ slug: 'incomplete', cls: 'other' });
            const tagsHTML = allTags.map(t => `<span class="tag-badge hashtag ${t.cls}" data-tag="${t.slug}">#${t.slug}</span>`).join('');
            document.getElementById('cfInfo').innerHTML = `
                <p class="cf-title">${escapeHTML(clip.title)}</p>
                <div class="cf-meta">${tagsHTML}</div>
                <a href="${clip.link}" class="clip-link" target="_blank" rel="noopener" id="cfWatch">▶ Watch</a>
                <div class="cf-count">${cfIndex + 1} / ${cfClips.length} · played ${stats.clicks || 0}×</div>
            `;
            document.getElementById('cfWatch').onclick = () => recordClick(clip.title);
            document.querySelectorAll('#cfInfo .hashtag').forEach(el => el.onclick = () => addHashtag(el.dataset.tag));
        }

        function recordClick(title) {
            if (!clipStats[title]) clipStats[title] = { clicks: 0, favorite: false, incomplete: false };
            clipStats[title].clicks++;
            saveClipStats();
            filterAndRenderLibrary();
        }

        window.addEventListener('load', function() {
            loadLibrary();
            // Apply favorites filter after a brief delay to ensure clips are loaded
            setTimeout(() => {
                filterAndRenderLibrary();
            }, 500);
        });

        // hq-bottom.html#blackmail or #library shows just that one section (for embedding side by side)
        (function singlePanel() {
            const only = location.hash.replace('#', '').toLowerCase();
            if (only !== 'blackmail' && only !== 'library') return;
            document.getElementById(only === 'blackmail' ? 'libraryPanel' : 'blackmailPanel').style.display = 'none';
            document.querySelector('.row-2col').style.gridTemplateColumns = '1fr';
            document.querySelectorAll('.divider, .bow').forEach(el => el.style.display = 'none');
        })();

        // BLACKMAIL
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        let bmItems = [];
        let bmIndex = 0;
        let bmShown = [];

        async function loadBlackmail() {
            try {
                const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_U4ZElEgkBkgv6jP20hJICA3lCqlWli4EezWccqE7F3JksP5F0qg9_OClPU6MaW1fawjHX5Gr7ZXs/pub?gid=1956196577&single=true&output=csv';
                const response = await fetch(csvUrl);
                const csv = await response.text();
                const lines = csv.trim().split('\n');

                bmItems = [];
                const months = new Set();
                lines.forEach((line, idx) => {
                    if (idx === 0 || !line.trim()) return;
                    const parts = line.split(',');
                    if (parts.length >= 4) {
                        const month = (parts[0] || '').trim();
                        const year = (parts[1] || '').trim();
                        const title = (parts[2] || '').trim();
                        const link = (parts[3] || '').trim();
                        const image = (parts[4] || '').trim();
                        if (month && year && title && link) {
                            bmItems.push({ month, year, title, link, image, order: idx });
                            months.add(`${month} ${year}`);
                        }
                    }
                });

                // Oldest on the left, newest on the right
                bmItems.sort((a, b) =>
                    (parseInt(a.year) - parseInt(b.year)) ||
                    (MONTHS.indexOf(a.month) - MONTHS.indexOf(b.month)) ||
                    (a.order - b.order));

                document.getElementById('bmCount').textContent = bmItems.length;
                document.getElementById('bmMonths').textContent = months.size;
                document.getElementById('bmSearch').addEventListener('input', filterBlackmail);
                filterBlackmail();

                document.getElementById('blackmailLoading').style.display = 'none';
                document.getElementById('blackmailSection').style.display = 'block';
            } catch (e) {
                console.log('Blackmail error:', e);
            }
        }

        function filterBlackmail() {
            const words = document.getElementById('bmSearch').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
            const hashtags = words.filter(w => w.startsWith('#') && w.length > 1).map(w => w.slice(1));
            const text = words.filter(w => !w.startsWith('#')).join(' ');
            const shown = bmItems.filter(item => {
                const m = item.month.toLowerCase();
                const matchesText = !text || text.split(' ').every(w =>
                    item.title.toLowerCase().includes(w) || m.startsWith(w) || item.year.startsWith(w));
                const matchesTags = hashtags.every(h => m.startsWith(h) || item.year.startsWith(h));
                return matchesText && matchesTags;
            });
            renderBlackmail(shown);
        }

        function addBmHashtag(tag) {
            const box = document.getElementById('bmSearch');
            if (!box.value.toLowerCase().split(/\s+/).includes(tag)) box.value = (box.value.trim() + ' ' + tag).trim();
            filterBlackmail();
        }

        // Works out how to show a link inside the page (null = can't embed)
        function embedFor(url) {
            const u = url.trim();
            const clean = u.split(/[?#]/)[0].toLowerCase();
            if (/\.(png|jpe?g|gif|webp|avif|bmp)$/.test(clean)) return { kind: 'img', src: u };
            if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return { kind: 'video', src: u };
            let m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
            if (m) return { kind: 'iframe', src: `https://drive.google.com/file/d/${m[1]}/preview` };
            m = u.match(/^https?:\/\/(?:i\.)?imgur\.com\/(?!a\/|gallery\/)(\w+)(?:\.(gifv|mp4))?/i);
            if (m) return m[2] ? { kind: 'video', src: `https://i.imgur.com/${m[1]}.mp4` } : { kind: 'img', src: `https://i.imgur.com/${m[1]}.jpg` };
            return null;
        }

        function bmThumb(item) {
            if (item.image) return item.image;
            const e = embedFor(item.link);
            if (!e) return '';
            if (e.kind === 'img') return e.src;
            const d = item.link.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
            return d ? `https://drive.google.com/thumbnail?id=${d[1]}&sz=w600` : '';
        }

        function openBlackmailItem(i) {
            const item = bmShown[i];
            if (!embedFor(item.link)) { window.open(item.link, '_blank', 'noopener'); return; }
            showLightbox(i);
        }

        function showLightbox(i) {
            const item = bmShown[i];
            const e = embedFor(item.link);
            const media = document.getElementById('lbMedia');
            const safe = e.src.replace(/"/g, '%22');
            media.innerHTML =
                e.kind === 'img' ? `<img src="${safe}" alt="">` :
                e.kind === 'video' ? `<video src="${safe}" controls autoplay playsinline></video>` :
                `<iframe src="${safe}" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            document.getElementById('lbTitle').textContent = item.title;
            document.getElementById('lbOpen').href = item.link;
            document.getElementById('lightbox').classList.add('open');
            lbIndex = i;
        }

        let lbIndex = 0;
        function stepLightbox(d) {
            let i = lbIndex;
            do { i += d; } while (i >= 0 && i < bmShown.length && !embedFor(bmShown[i].link));
            if (i < 0 || i >= bmShown.length) return;
            setBmIndex(i);
            showLightbox(i);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.getElementById('lbMedia').innerHTML = '';
        }

        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') stepLightbox(-1);
            if (e.key === 'ArrowRight') stepLightbox(1);
        });
        document.addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });

        function bmCover(item) {
            const h = hashString(item.title + item.month + item.year);
            const palette = ['#FF69B4', '#9C27B0', '#E91E63', '#FF1744', '#7B1FA2', '#F06292'];
            const c1 = palette[h % palette.length];
            const c2 = palette[(h >>> 4) % palette.length] === c1 ? '#4A0E4E' : palette[(h >>> 4) % palette.length];
            const x = (h >>> 8) % 100, y = (h >>> 14) % 100;
            const cover = `radial-gradient(circle at ${x}% ${y}%, rgba(255,255,255,0.45) 0, rgba(255,255,255,0) 35%),
                           linear-gradient(${h % 360}deg, ${c1}, ${c2})`;
            // A cover in the repo's blackmail folder (e.g. blackmail/puppy-meal.jpg) wins;
            // if that file doesn't exist the browser falls through to the next layer.
            const slug = item.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const custom = `url("https://sissymaddieee.github.io/GGT/blackmail/${slug}.jpg")`;
            const thumb = bmThumb(item);
            return thumb ? `${custom}, url("${thumb.replace(/"/g, '%22')}"), ${cover}` : `${custom}, ${cover}`;
        }

        function renderBlackmail(items) {
            const list = document.getElementById('blackmailList');
            const prev = bmShown[bmIndex];
            bmShown = items;
            const keep = items.indexOf(prev);
            bmIndex = keep >= 0 ? keep : items.length - 1; // start on the most recent

            if (!items.length) {
                list.innerHTML = '<div class="cf-empty">Nothing matches.</div>';
                return;
            }

            list.innerHTML = `
                <div class="coverflow" id="bmFlow" tabindex="0">
                    <button class="cf-arrow left" id="bmPrev" aria-label="Previous">‹</button>
                    <button class="cf-arrow right" id="bmNext" aria-label="Next">›</button>
                </div>
                <input type="range" class="cf-slider" id="bmSlider" min="0" max="${items.length - 1}" value="${bmIndex}">
                <div class="cf-info" id="bmInfo"></div>
            `;

            const flow = document.getElementById('bmFlow');
            items.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'cf-item';
                el.style.backgroundImage = bmCover(item);
                el.innerHTML = `
                    <div class="cf-date">${escapeHTML(item.month.slice(0, 3))} ${escapeHTML(item.year)}</div>
                    ${bmThumb(item) ? '' : `<div class="cf-label">${escapeHTML(item.title)}</div>`}
                `;
                el.addEventListener('click', () => {
                    if (i === bmIndex) openBlackmailItem(i);
                    else setBmIndex(i);
                });
                flow.appendChild(el);
            });

            document.getElementById('bmPrev').onclick = () => setBmIndex(bmIndex - 1);
            document.getElementById('bmNext').onclick = () => setBmIndex(bmIndex + 1);
            document.getElementById('bmSlider').oninput = e => setBmIndex(+e.target.value);

            flow.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') { setBmIndex(bmIndex - 1); e.preventDefault(); }
                if (e.key === 'ArrowRight') { setBmIndex(bmIndex + 1); e.preventDefault(); }
                if (e.key === 'Enter') flow.querySelector('.cf-item.center')?.click();
            });

            let wheelLock = false;
            flow.addEventListener('wheel', e => {
                const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                if (Math.abs(d) < 4) return;
                e.preventDefault();
                if (wheelLock) return;
                wheelLock = true;
                setBmIndex(bmIndex + (d > 0 ? 1 : -1));
                setTimeout(() => wheelLock = false, 140);
            }, { passive: false });

            let startX = null;
            flow.addEventListener('pointerdown', e => { startX = e.clientX; });
            flow.addEventListener('pointerup', e => {
                if (startX === null) return;
                const dx = e.clientX - startX;
                if (Math.abs(dx) > 30) setBmIndex(bmIndex - Math.round(dx / 60));
                startX = null;
            });

            layoutBlackmail();
        }

        function setBmIndex(i) {
            const n = Math.max(0, Math.min(bmShown.length - 1, i));
            if (n === bmIndex) return;
            bmIndex = n;
            layoutBlackmail();
        }

        function layoutBlackmail() {
            positionFlowItems(document.querySelectorAll('#bmFlow .cf-item'), bmIndex);
            document.getElementById('bmSlider').value = bmIndex;

            const item = bmShown[bmIndex];
            const tags = [item.month.toLowerCase(), item.year];
            document.getElementById('bmInfo').innerHTML = `
                <p class="cf-title">${escapeHTML(item.title)}</p>
                <div class="cf-meta">${tags.map(t => `<span class="tag-badge hashtag sissy" data-tag="${escapeHTML(t)}">${escapeHTML(t)}</span>`).join('')}</div>
                <a href="${item.link}" class="clip-link" target="_blank" rel="noopener" id="bmView">View</a>
                <div class="cf-count">${bmIndex + 1} / ${bmShown.length}</div>
            `;
            document.getElementById('bmView').onclick = e => { if (embedFor(item.link)) { e.preventDefault(); openBlackmailItem(bmIndex); } };
            document.querySelectorAll('#bmInfo .hashtag').forEach(el => el.onclick = () => addBmHashtag(el.dataset.tag));
        }

        window.addEventListener('load', loadBlackmail);
    </script>
    <div class="lightbox" id="lightbox">
        <button class="lb-close" aria-label="Close" onclick="closeLightbox()">×</button>
        <div class="lb-media" id="lbMedia"></div>
        <div class="lb-bar">
            <button onclick="stepLightbox(-1)">‹ Prev</button>
            <span id="lbTitle"></span>
            <button onclick="stepLightbox(1)">Next ›</button>
            <a id="lbOpen" target="_blank" rel="noopener">Open ↗</a>
        </div>
    </div>
</body>
</html>

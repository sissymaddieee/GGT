  posts.forEach(p=>{const k=ymd(weekStart(p.d));const w=W.find(w=>ymd(w.s)===k);if(w){w.views+=p.vi||0;w.ups+=p.up||0;w.posts++;}});
  M.weeks=W;
  // prediction index
  const df={};M.rated.forEach(p=>{p.tok=new Set(tokens(p.text));p.tok.forEach(w=>df[w]=(df[w]||0)+1);});
  const N=M.rated.length;M.idf=w=>Math.log((N+1)/((df[w]||0)+1))+1;
  M.rated.forEach(p=>{let s=0;p.tok.forEach(w=>s+=M.idf(w)**2);p.norm=Math.sqrt(s)||1;});
  return M;
}

/* ---------- prediction ---------- */
function bucket(h){if(h===null||h===undefined)return null;if(h>=6&&h<=9)return'Early morning (6–9 AM)';if(h>=10&&h<=12)return'Late morning (10 AM–12 PM)';if(h>=13&&h<=16)return'Afternoon (1–4 PM)';if(h>=17&&h<=20)return'Evening (5–8 PM)';return'Night (9 PM–5 AM)';}
function bestOf(list,keyFn){
  const g={};list.forEach(p=>{const k=keyFn(p);if(k==null)return;(g[k]=g[k]||[]).push(p.upC);});
  const rows=Object.keys(g).map(k=>({k,n:g[k].length,avg:avg(g[k])}));
  const cand=rows.filter(r=>r.n>=2).sort((a,b)=>b.avg-a.avg);if(!cand.length)return null;
  const best=cand[0],others=rows.filter(r=>r!==best);
  const om=others.length?avg(others.map(r=>r.avg)):null;
  const conf=(best.n>=3&&om!==null&&best.avg>=1.2*om)?'hi':'mid';
  return{...best,conf,tested:rows.length};
}
function predict(M,text){
  const q=new Set(tokens(text));if(!q.size)return null;
  const cat=categorize(text,'');
  let qn=0;q.forEach(w=>qn+=M.idf(w)**2);qn=Math.sqrt(qn)||1;
  const scored=M.rated.map(p=>{let dot=0;q.forEach(w=>{if(p.tok.has(w))dot+=M.idf(w)**2;});
    return{p,s:dot/(qn*p.norm)+(cat&&p.cat===cat?0.12:0),strong:true};}).sort((a,b)=>b.s-a.s);
  let nb=scored.filter(x=>x.s>=0.14).slice(0,30);
  if(nb.length<4&&cat){scored.filter(x=>x.p.cat===cat&&!nb.includes(x)).slice(0,20).forEach(x=>nb.push({p:x.p,s:0.12,strong:false}));}
  if(!nb.length)return{cat,empty:true};
  // where
  const g={};nb.forEach(x=>(g[x.p.subKey]=g[x.p.subKey]||[]).push(x));
  const where=Object.keys(g).map(k=>{const a=g[k],sw=a.reduce((s,x)=>s+x.s,0),su=a.reduce((s,x)=>s+x.s*x.p.upC,0);
    const prior=M.subAvg[k]||0;return{key:k,name:M.name(k),n:a.length,nStrong:a.filter(x=>x.strong).length,score:(su+0.3*prior)/(sw+0.3)};})
    .sort((a,b)=>b.score-a.score).slice(0,3)
    .map(w=>({...w,conf:w.nStrong>=3?'hi':w.n>=2?'mid':'lo'}));
  // titles
  const seen=new Set(),titles=[];
  nb.slice().sort((a,b)=>b.p.upC-a.p.upC).forEach(x=>{const c=x.p.cap;if(!c||seen.has(c.toLowerCase())||titles.length>=3)return;seen.add(c.toLowerCase());titles.push({t:c,sub:M.name(x.p.subKey),up:x.p.up});});
  // when
  const pool=nb.map(x=>x.p).filter(p=>p.hour!==null);
  const all=M.rated.filter(p=>p.hour!==null);
  let scope='similar clips',d=bestOf(pool,p=>p.day),h=bestOf(pool,p=>bucket(p.hour));
  if(!d){d=bestOf(all,p=>p.day);scope='all clips';}
  const h2=h||bestOf(all,p=>bucket(p.hour));
  const dayCount={};M.posts.forEach(p=>dayCount[p.day]=(dayCount[p.day]||0)+1);
  const topDay=Object.keys(dayCount).sort((a,b)=>dayCount[b]-dayCount[a])[0];
  const share=dayCount[topDay]/M.posts.length;
  let bestHour=null;if(h2){const hs={};(h?pool:all).filter(p=>bucket(p.hour)===h2.k).forEach(p=>(hs[p.hour]=hs[p.hour]||[]).push(p.upC));
    const o=Object.keys(hs).map(k=>({k:+k,avg:avg(hs[k])})).sort((a,b)=>b.avg-a.avg)[0];bestHour=o?o.k:null;}
  return{cat,where,titles,day:d,hour:h2,bestHour,scope,hourScope:h?'similar clips':'all clips',n:nb.length,domDay:share>0.4?topDay:null,domShare:share,fallback:nb.some(x=>!x.strong)};
}

/* ---------- html builders ---------- */
const tip=t=>' data-tip="'+esc(t)+'"';
function delta(a,b){if(!b)return'';const pc=Math.round((a-b)/b*100);if(pc===0)return'';return'<span class="'+(pc>0?'up':'down')+'">'+(pc>0?'▲ ':'▼ ')+Math.abs(pc)+'%</span> ';}
function tilesHTML(M){
  const t=(l,n,s,tp)=>'<div class="tile"'+tip(tp)+'><div class="l">'+l+'</div><div class="n">'+n+'</div><div class="s">'+s+'</div></div>';
  const q3=M.subs.filter(s=>s.rated>=MIN_RATED).length;
  return t('Views reached',fmtNum(M.tot.views),delta(M.last.views,M.prev.views)+fmtNum(M.last.views)+' in the last 4 weeks','Total views across every post that has views recorded. The % compares the last 4 weeks with the 4 weeks before.')
   +t('Upvotes',fmtNum(M.tot.ups),delta(M.last.ups,M.prev.ups)+fmtNum(M.last.ups)+' in the last 4 weeks','Total upvotes across all posts. The % compares the last 4 weeks with the 4 weeks before.')
   +t('Posts',M.tot.posts,delta(M.last.posts,M.prev.posts)+M.thisWeek+' this week','Every post logged. “This week” counts posts since Monday.')
   +t('Communities',M.tot.subs,q3+' with 3+ rated posts','Different subreddits Goddess has been posted in.');
}
function lineChart(vals,labels,fmt,what){
  const W=560,H=300,L=46,R=14,T=14,B=28,iw=W-L-R,ih=H-T-B;
  const m=Math.max(...vals,1),mag=Math.pow(10,Math.floor(Math.log10(m)));
  const max=[1,1.5,2,2.5,3,4,5,6,8,10].map(s=>s*mag).find(v=>v>=m)||m;
  const x=i=>L+(vals.length===1?iw/2:i*iw/(vals.length-1)),y=v=>T+ih-(v/max)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4f9a" stop-opacity=".35"/><stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/></linearGradient></defs>';
  [0,.5,1].forEach(f=>{const v=max*f,yy=y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#ffd3e5" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end" font-size="10" fill="#a2607f">'+fmtNum(v)+'</text>';});
  const pts=vals.map((v,i)=>x(i)+','+y(v));
  s+='<polygon points="'+x(0)+','+y(0)+' '+pts.join(' ')+' '+x(vals.length-1)+','+y(0)+'" fill="url(#ag)"/>';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#ff4f9a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach((v,i)=>{s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.4" fill="#fff" stroke="#ff4f9a" stroke-width="2"/><circle cx="'+x(i)+'" cy="'+y(v)+'" r="11" fill="transparent"'+tip(labels[i].tip(v))+'/>';
    if(i%2===(vals.length-1)%2)s+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#a2607f">'+labels[i].l+'</text>';});
  return s+'</svg>';
}
let metric='views';
const METRICS={views:['Views','views','views'],ups:['Upvotes','ups','upvotes'],posts:['Posts','posts','posts']};
function chartHTML(M){
  const wk=M.weeks,raw=wk.map(w=>w[metric]);
  const roll=raw.map((v,i)=>i===0?v:(v+raw[i-1])/2).slice(1);
  const labels=wk.slice(1).map((w,i)=>({l:(w.s.getMonth()+1)+'/'+w.s.getDate(),
    tip:v=>'Week of '+(w.s.getMonth()+1)+'/'+w.s.getDate()+': '+fmtNum(raw[i+1])+' '+METRICS[metric][2]+' that week · '+fmtNum(v)+' on a 2-week rolling average'}));
  const first=avg(roll.slice(0,4)),lastA=avg(roll.slice(-4));
  const note=first>0?(lastA>=first?'Trending up ♡ ':'Quieter lately · '):'';
  return '<div class="hint" style="margin-bottom:2px">'+note+'2-week rolling average, last 13 weeks</div>'+lineChart(roll,labels);
}
function tabsHTML(){return Object.keys(METRICS).map(k=>'<button class="tab'+(k===metric?' on':'')+'" data-m="'+k+'"'+tip('Show '+METRICS[k][2]+' per week')+'>'+METRICS[k][0]+'</button>').join('');}
function typesHTML(M){
  if(!M.cats.length)return'<div class="hint">No clip data yet.</div>';
  const q=M.cats.filter(c=>c.n>=MIN_RATED),top=q[0],max=Math.max(...M.cats.map(c=>c.avg),1);
  let s=top?'<div class="take"><b>'+esc(tagLabel(top.tag))+'</b> clips earn the most upvotes — about '+Math.round(top.avg)+' per post'+(top.best?', best in <b>'+esc(top.best)+'</b>':'')+'. ♡</div>':'';
  M.cats.forEach(c=>{const ok=c.n>=MIN_RATED;
    s+='<div class="bar-row'+(ok?'':' dim')+'"'+tip(tagLabel(c.tag)+' — '+TAG_HELP[c.tag]+'. Average '+c.avg.toFixed(1)+' upvotes (each post capped at '+CAP_UP+') and '+fmtNum(c.views)+' views (capped at '+fmtNum(CAP_VI)+') over '+c.n+' posts.'+(ok?'':' Fewer than '+MIN_RATED+' posts, so treat as an early read.'))+'>'
     +'<div class="nm">'+esc(tagLabel(c.tag))+'<span class="sub">'+c.n+' posts'+(c.best?' · '+esc(c.best):'')+'</span></div>'
     +'<div class="track"><div class="fill" style="width:'+Math.max(4,c.avg/max*100)+'%"></div></div><div class="v">'+Math.round(c.avg)+'</div></div>';});
  return s+'<div class="hint" style="margin-top:6px">Average upvotes per post · striped = under '+MIN_RATED+' posts</div>';
}
function subsHTML(M){
  const q=M.subs.filter(s=>s.rated>=MIN_RATED),rest=M.subs.filter(s=>s.rated<MIN_RATED);
  const max=Math.max(...q.map(s=>s.avg),1);
  let s=q[0]?'<div class="take">Top community: <b>'+esc(q[0].name)+'</b> · '+Math.round(q[0].avg)+' avg upvotes ♡</div>':'';
  q.slice(0,7).forEach((c,i)=>{s+='<div class="bar-row"'+tip(c.name+': '+c.posts+' posts, '+Math.round(c.avg)+' average upvotes (capped at '+CAP_UP+'), '+fmtNum(c.views)+' total views.')+'><div class="nm">'+(i+1)+'. '+esc(c.name.replace(/^r\//,''))+'<span class="sub">'+c.posts+' posts · '+fmtNum(c.views)+' views</span></div><div class="track"><div class="fill" style="width:'+Math.max(4,c.avg/max*100)+'%"></div></div><div class="v">'+Math.round(c.avg)+'</div></div>';});
  const more=q.slice(7).concat(rest);
  if(more.length){s+='<div class="hint" style="margin-top:6px">Also reaching</div><div class="chips">'+more.slice(0,14).map(c=>'<span class="chip static"'+tip(c.name+' · '+c.posts+' posts · '+fmtNum(c.views)+' views')+'>'+esc(c.name)+'</span>').join('')+(more.length>14?'<span class="chip static">+'+(more.length-14)+' more</span>':'')+'</div>';}
  return s;
}
function topsHTML(M){
  return M.tops.map(p=>'<div class="top"><a href="'+esc(p.link)+'" target="_blank" rel="noopener"'+tip(p.cap||p.title)+'>'+esc(p.cap||p.title||'(untitled)')+'</a><span class="u">'+p.up+' ♡</span><small>'+esc(M.name(p.subKey))+' · '+(p.d.getMonth()+1)+'/'+p.d.getDate()+'/'+String(p.d.getFullYear()).slice(2)+(p.vi?' · '+fmtNum(p.vi)+' views':'')+'</small></div>').join('')||'<div class="hint">Nothing yet.</div>';
}
function pill(c,t){return'<span class="pill '+c+'">'+t+'</span>';}
const CONF={hi:['hi','Strong'],mid:['mid','Good'],lo:['lo','Test it']};
function predHTML(M,r){
  if(!r)return'<div class="note">Type a clip idea above and I\'ll suggest where to post it, what to title it, and when. ♡</div>';
  if(r.empty)return'<div class="note">I don\'t have similar posts for that yet — try words like <b>goon</b>, <b>chastity</b>, <b>CEI</b>, <b>sissy</b> or <b>blackmail</b>.</div>';
  let s='<div class="detected">Looks like a <span class="chip static">'+esc(r.cat?tagLabel(r.cat):'new kind of')+'</span> clip · based on '+r.n+' similar post'+(r.n===1?'':'s')+(r.fallback?' '+pill('lo','broad match'):'')+'</div>';
  s+='<div class="box"><h3>Where to post</h3>'+r.where.map(w=>'<div class="pick"'+tip('Expected ≈'+Math.round(w.score)+' upvotes, from '+w.n+' similar post'+(w.n===1?'':'s')+' there (capped at '+CAP_UP+').')+'><span>'+esc(w.name)+'<small> ~'+Math.round(w.score)+'♡</small></span>'+pill(CONF[w.conf][0],CONF[w.conf][1])+'</div>').join('')+'</div>';
  s+='<div class="box"><h3>Title ideas (past winners)</h3>'+(r.titles.map(t=>'<div class="ttl">'+esc(t.t)+'<small>'+esc(t.sub)+' · '+t.up+' upvotes</small></div>').join('')||'<div class="hint">No captions to borrow yet.</div>')+'</div>';
  let w='';
  if(r.day){w+='<div class="big">'+r.day.k+'s</div>'+pill(r.day.conf,r.day.conf==='hi'?'Confident':'Early signal')+'<div class="hint">avg '+Math.round(r.day.avg)+'♡ over '+r.day.n+' posts ('+r.scope+')</div>';}
  else w+='<div class="hint">Not enough data to pick a day yet.</div>';
  if(r.hour){w+='<div style="margin-top:6px;font-size:14px" class="big">'+esc(r.hour.k.split(' (')[0])+'</div>'+pill(r.hour.conf,r.hour.conf==='hi'?'Confident':'Early signal')+'<div class="hint">'+(r.bestHour!==null?'best hour ≈ '+fmtHour(r.bestHour)+' · ':'')+r.hour.n+' posts ('+r.hourScope+')</div>';}
  else w+='<div class="hint" style="margin-top:6px">Not enough data to pick a time yet.</div>';
  s+='<div class="box"><h3>When</h3>'+w+'</div>';
  if(r.domDay)s+='<div class="note">Heads up: '+Math.round(r.domShare*100)+'% of posts so far were on '+r.domDay+'s, so other days haven\'t had a fair test. Try a few on different days to learn more.</div>';
  return s;
}

/* ---------- app ---------- */
let rows=[],M=null;
const $=id=>document.getElementById(id);
function runPredict(){const t=$('q').value.trim();$('out').innerHTML=predHTML(M,t&&M?predict(M,t):null);}
function paint(){
  M=analyze(rows);
  $('tiles').innerHTML=tilesHTML(M);$('tabs').innerHTML=tabsHTML();$('chart').innerHTML=chartHTML(M);
  $('types').innerHTML=typesHTML(M);$('subs').innerHTML=subsHTML(M);$('tops').innerHTML=topsHTML(M);runPredict();
  const n=new Date();$('status').innerHTML='<b>●</b> Live · updated '+n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
async function load(){
  try{
    if(LIB_URL&&!load.libDone){try{const t=await (await fetch(LIB_URL)).text();const L=parseCSV(t).map(r=>[r['title'],r['tag']]).filter(x=>x[0]&&x[1]);if(L.length){LIB=L;}}catch(e){}load.libDone=true;}
    buildLib();
    const res=await fetch(CSV_URL);
    if(!res.ok){$('status').textContent='Could not load (HTTP '+res.status+')';return;}
    rows=parseCSV(await res.text());
    if(!rows.length){$('status').textContent='No rows found';return;}
    paint();
  }catch(e){$('status').textContent='Error: '+e.message;}
}
if(typeof document!=='undefined'&&document.getElementById&&typeof window!=='undefined'){
  $('examples').innerHTML=['goon edging challenge','chastity key denial','blackmail contract task','sissy feminization training'].map(t=>'<button class="chip" data-ex="'+esc(t)+'">'+esc(t)+'</button>').join(' ');
  document.addEventListener('click',e=>{
    const ex=e.target.closest('[data-ex]');if(ex){$('q').value=ex.dataset.ex;if(M)runPredict();}
    const tb=e.target.closest('[data-m]');if(tb){metric=tb.dataset.m;if(M){$('tabs').innerHTML=tabsHTML();$('chart').innerHTML=chartHTML(M);}}
    if(e.target.closest('#goBtn')&&M)runPredict();
  });
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(M)runPredict();}});
  const T=$('tip');
  document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){T.textContent=t.dataset.tip;T.style.display='block';}else T.style.display='none';});
  document.addEventListener('mousemove',e=>{if(T.style.display==='block'){T.style.left=Math.min(e.clientX+14,window.innerWidth-270)+'px';T.style.top=(e.clientY+16)+'px';}});
  document.addEventListener('mouseout',e=>{if(!e.relatedTarget)T.style.display='none';});
  buildLib();load();setInterval(load,60000);
}
if(typeof module!=='undefined')module.exports={parseCSV,analyze,predict,categorize,buildLib,tilesHTML,chartHTML,typesHTML,subsHTML,topsHTML,predHTML,setLib:l=>{LIB=l;buildLib();}};
</script>

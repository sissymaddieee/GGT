<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reddit Promo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
#app { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; height: 100vh; }
header { display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 13px; font-weight: 500; color: #fff; }
header span { font-size: 11px; color: #444; }
.label { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }

/* Trend row */
.trends { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.trend-card { background: #1a1a1a; border: 0.5px solid #222; border-radius: 8px; padding: 8px 10px; }
.trend-card svg { width: 100%; height: 36px; display: block; }

/* Middle */
.middle { display: grid; grid-template-columns: 1.6fr 1fr; gap: 8px; }

/* Matrix */
.matrix-wrap { background: #1a1a1a; border: 0.5px solid #222; border-radius: 8px; padding: 8px 10px; overflow: auto; }
.matrix-table { border-collapse: collapse; width: 100%; font-size: 10px; }
.matrix-table th { color: #555; font-weight: 400; padding: 3px 5px; text-align: center; white-space: nowrap; border-bottom: 0.5px solid #222; }
.matrix-table th.sub-col { text-align: left; max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
.matrix-table td { padding: 3px 5px; text-align: center; }
.matrix-table td.sub-name { text-align: left; color: #888; white-space: nowrap; }
.cell { width: 28px; height: 18px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 500; }
.cell-empty { background: #1f1f1f; color: #333; }
.cell-low { background: #1f2a1f; color: #4a7a4a; }
.cell-mid { background: #2a3a1a; color: #7aaa4a; }
.cell-high { background: #3a5a1a; color: #aacc6a; }
.cell-star { background: #3a2a0a; color: #cc9933; }

/* Time */
.time-card { background: #1a1a1a; border: 0.5px solid #222; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
.bar-lbl { font-size: 9px; color: #555; width: 22px; flex-shrink: 0; }
.bar-track { flex: 1; height: 3px; background: #222; border-radius: 2px; }
.bar-fill { height: 3px; background: #555; border-radius: 2px; }
.bar-val { font-size: 9px; color: #444; width: 20px; text-align: right; flex-shrink: 0; }
.day-bars { display: flex; gap: 4px; align-items: flex-end; height: 32px; }
.day-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
.day-bar { width: 100%; background: #333; border-radius: 2px; }
.day-lbl { font-size: 8px; color: #444; }

/* Bottom */
.bottom { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.bottom-card { background: #1a1a1a; border: 0.5px solid #222; border-radius: 8px; padding: 8px 10px; }
.kw-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.kw { font-size: 9px; padding: 2px 6px; border-radius: 99px; border: 0.5px solid #222; color: #888; }
.kw.good { border-color: #2a4a2a; color: #5a9a5a; background: #111a11; }
.kw.bad { border-color: #4a2a2a; color: #9a5a5a; background: #1a1111; }
.standout-val { font-size: 16px; font-weight: 500; color: #cc9933; }
.standout-sub { font-size: 10px; color: #666; margin-top: 2px; }
.standout-cap { font-size: 10px; color: #888; margin-top: 4px; line-height: 1.4; }
.empty { color: #444; font-size: 11px; padding: 1rem 0; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Reddit Promo</h1>
    <span id="last-updated">Loading...</span>
  </header>

  <div class="trends">
    <div class="trend-card"><div class="label">Posts per week</div><svg id="spark-posts"></svg></div>
    <div class="trend-card"><div class="label">Avg upvotes</div><svg id="spark-up"></svg></div>
    <div class="trend-card"><div class="label">Avg views</div><svg id="spark-vi"></svg></div>
    <div class="trend-card"><div class="label">Total reach</div><svg id="spark-reach"></svg></div>
  </div>

  <div class="middle">
    <div class="matrix-wrap">
      <div class="label">Clip performance by subreddit</div>
      <div id="matrix"><div class="empty">No data yet.</div></div>
    </div>
    <div class="time-card">
      <div>
        <div class="label">Hour of day (avg upvotes)</div>
        <div id="hours"></div>
      </div>
      <div>
        <div class="label">Day of week</div>
        <div class="day-bars" id="days"></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="bottom-card">
      <div class="label">Keywords</div>
      <div id="keywords"><div class="empty">3+ uses needed.</div></div>
    </div>
    <div class="bottom-card">
      <div class="label">Emojis</div>
      <div id="emojis"><div class="empty">2+ uses needed.</div></div>
    </div>
    <div class="bottom-card">
      <div class="label">Best post this month</div>
      <div id="standout"><div class="empty">No standouts yet.</div></div>
    </div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8uQbcMgMda1qjeGCrU7frdIXjjPhumy3coHvalSBj42Pu6FwvAMY00YcWTf3l34FjvyOtnXNFzAp8/pub?gid=1325102424&single=true&output=csv';
const CAP_UP = 50, CAP_VI = 10000;
const STOPWORDS = new Set(['the','a','an','and','or','to','of','in','is','it','i','my','me','you','your','for','on','at','with','this','that','be','as','so','but','if','do','not','are','have','was','he','she','they','we','can','just','its','from','by','has','had','will','more','get','got','like','about','up','out','all','her','his','him','am','no','yes','one','what','when','how','dont','im','start','now']);

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    const vals = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQ = !inQ; }
      else if (line[i] === ',' && !inQ) { vals.push(cur.trim()); cur = ''; }
      else { cur += line[i]; }
    }
    vals.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h] = (vals[i]||'').replace(/^"|"$/g,'').trim());
    return obj;
  }).filter(r => r['date'] || r['subreddit']);
}

function num(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }

function parseDate(d) {
  if (!d) return null;
  const p = d.split('/');
  if (p.length === 3) {
    let [m,day,yr] = p;
    if (yr.length===2) yr='20'+yr;
    return new Date(parseInt(yr),parseInt(m)-1,parseInt(day));
  }
  return new Date(d);
}

function getWeekKey(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  dt.setDate(dt.getDate() - day + (day===0?-6:1));
  return dt.toISOString().split('T')[0];
}

function getMonthRows_unused(rows) {
  const now = new Date();
  return rows.filter(r => {
    const d = parseDate(r['date']);
    return d && d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
}

function sparkline(svgId, values, color) {
  const svg = document.getElementById(svgId);
  if (!values.length) { svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#333" font-size="9">no data</text>'; return; }
  const W = svg.clientWidth || 160, H = 36, pad = 4;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v,i) => {
    const x = pad + (i/(values.length-1||1))*(W-pad*2);
    const y = H - pad - ((v-min)/range)*(H-pad*2);
    return `${Math.round(x)},${Math.round(y)}`;
  });
  const trend = values[values.length-1] >= values[0];
  const lineColor = color || (trend ? '#5a9a5a' : '#9a5a5a');
  svg.innerHTML = `<polyline points="${pts.join(' ')}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="2.5" fill="${lineColor}"/>`;
}

function render(rows) {
  const monthRows = rows;

  // Sparklines — by week
  const weekMap = {};
  rows.forEach(r => {
    const d = parseDate(r['date']); if (!d) return;
    const wk = getWeekKey(d);
    if (!weekMap[wk]) weekMap[wk] = { posts:0, upTotal:0, upCount:0, viTotal:0, viCount:0 };
    weekMap[wk].posts++;
    const u = num(r['upvotes']); if (u!==null) { weekMap[wk].upTotal+=Math.min(u,CAP_UP); weekMap[wk].upCount++; }
    const v = num(r['views']); if (v!==null) { weekMap[wk].viTotal+=Math.min(v,CAP_VI); weekMap[wk].viCount++; }
  });
  const weeks = Object.keys(weekMap).sort();
  const postsByWk = weeks.map(w => weekMap[w].posts);
  const upByWk = weeks.map(w => weekMap[w].upCount ? Math.round(weekMap[w].upTotal/weekMap[w].upCount) : 0);
  const viByWk = weeks.map(w => weekMap[w].viCount ? Math.round(weekMap[w].viTotal/weekMap[w].viCount) : 0);
  const reachByWk = weeks.map(w => weekMap[w].upTotal + weekMap[w].viTotal);

  setTimeout(() => {
    sparkline('spark-posts', postsByWk);
    sparkline('spark-up', upByWk);
    sparkline('spark-vi', viByWk);
    sparkline('spark-reach', reachByWk);
  }, 50);

  // Matrix — clips vs subs
  const clipTitles = [...new Set(monthRows.map(r=>r['clip title']).filter(Boolean))].slice(0,8);
  const subs = [...new Set(monthRows.map(r=>r['subreddit']).filter(Boolean))];
  const matEl = document.getElementById('matrix');
  if (!clipTitles.length || !subs.length) { matEl.innerHTML = '<div class="empty">Post data needed.</div>'; }
  else {
    const perf = {};
    monthRows.forEach(r => {
      const k = `${r['subreddit']}|||${r['clip title']}`;
      if (!perf[k]) perf[k] = { total:0, count:0 };
      const u = num(r['upvotes']); if (u!==null) { perf[k].total+=Math.min(u,CAP_UP); perf[k].count++; }
    });
    const cellClass = (sub, clip) => {
      const k = `${sub}|||${clip}`;
      if (!perf[k] || !perf[k].count) return null;
      const avg = perf[k].total/perf[k].count;
      if (avg>=40) return ['cell-star', Math.round(avg)];
      if (avg>=20) return ['cell-high', Math.round(avg)];
      if (avg>=10) return ['cell-mid', Math.round(avg)];
      return ['cell-low', Math.round(avg)];
    };
    matEl.innerHTML = `<table class="matrix-table">
      <thead><tr>
        <th class="sub-col">Sub</th>
        ${clipTitles.map(c=>`<th title="${c}">${c.length>10?c.slice(0,10)+'…':c}</th>`).join('')}
      </tr></thead>
      <tbody>${subs.map(s=>`<tr>
        <td class="sub-name">${s}</td>
        ${clipTitles.map(c=>{
          const r = cellClass(s,c);
          if (!r) return `<td><span class="cell cell-empty">—</span></td>`;
          return `<td><span class="cell ${r[0]}">${r[1]}</span></td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table>`;
  }

  // Hours
  const byHour = {};
  monthRows.filter(r=>r['hour']&&num(r['upvotes'])!==null&&num(r['upvotes'])<CAP_UP).forEach(r=>{
    const h=r['hour']; if(!byHour[h]) byHour[h]={total:0,count:0};
    byHour[h].total+=num(r['upvotes']); byHour[h].count++;
  });
  const hourEntries = Object.entries(byHour).map(([h,v])=>[h,Math.round(v.total/v.count)]).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
  const hEl = document.getElementById('hours');
  if (!hourEntries.length) { hEl.innerHTML = '<div class="empty" style="padding:.5rem 0">No data.</div>'; }
  else {
    const max = Math.max(...hourEntries.map(e=>e[1]));
    hEl.innerHTML = hourEntries.map(([h,avg])=>`
      <div class="bar-row">
        <span class="bar-lbl">${h}:00</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((avg/max)*100)}%"></div></div>
        <span class="bar-val">${avg}</span>
      </div>`).join('');
  }

  // Days
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const byDay = {};
  monthRows.filter(r=>r['day of week']&&num(r['upvotes'])!==null&&num(r['upvotes'])<CAP_UP).forEach(r=>{
    const d=r['day of week'].slice(0,3); if(!byDay[d]) byDay[d]={total:0,count:0};
    byDay[d].total+=num(r['upvotes']); byDay[d].count++;
  });
  const dayVals = DAYS.map(d=>byDay[d]?Math.round(byDay[d].total/byDay[d].count):0);
  const maxDay = Math.max(...dayVals,1);
  document.getElementById('days').innerHTML = DAYS.map((d,i)=>`
    <div class="day-bar-wrap">
      <div class="day-bar" style="height:${Math.max(2,Math.round((dayVals[i]/maxDay)*28))}px"></div>
      <span class="day-lbl">${d.slice(0,1)}</span>
    </div>`).join('');

  // Keywords
  const kwData = {};
  monthRows.filter(r=>r['caption']&&num(r['upvotes'])!==null&&num(r['upvotes'])<CAP_UP).forEach(r=>{
    const words=r['caption'].toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w=>w.length>2&&!STOPWORDS.has(w));
    words.forEach(w=>{ if(!kwData[w]) kwData[w]={total:0,count:0}; kwData[w].total+=num(r['upvotes']); kwData[w].count++; });
  });
  const overallAvg = monthRows.filter(r=>num(r['upvotes'])!==null&&num(r['upvotes'])<CAP_UP).reduce((a,r,_,arr)=>a+num(r['upvotes'])/arr.length,0);
  const kwEntries = Object.entries(kwData).filter(([,v])=>v.count>=3).map(([w,v])=>({w,avg:Math.round(v.total/v.count),count:v.count})).sort((a,b)=>b.avg-a.avg);
  const kwEl = document.getElementById('keywords');
  if (!kwEntries.length) { kwEl.innerHTML = '<div class="empty">3+ uses needed.</div>'; }
  else {
    const good=kwEntries.filter(k=>k.avg>overallAvg).slice(0,8);
    const bad=kwEntries.filter(k=>k.avg<=overallAvg).slice(-5);
    kwEl.innerHTML = `<div class="kw-grid">${good.map(k=>`<span class="kw good" title="${k.count} posts · ${k.avg} avg">${k.w} <span style="opacity:.6">${k.avg}</span></span>`).join('')}${bad.map(k=>`<span class="kw bad" title="${k.count} posts · ${k.avg} avg">${k.w} <span style="opacity:.6">${k.avg}</span></span>`).join('')}</div>`;
  }

  // Emojis
  const emojiRe = /\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu;
  const emData = {};
  monthRows.filter(r=>r['caption']&&num(r['upvotes'])!==null&&num(r['upvotes'])<CAP_UP).forEach(r=>{
    const found=[...new Set(r['caption'].match(emojiRe)||[])];
    found.forEach(e=>{ if(!emData[e]) emData[e]={total:0,count:0}; emData[e].total+=num(r['upvotes']); emData[e].count++; });
  });
  const emEntries=Object.entries(emData).filter(([,v])=>v.count>=2).map(([e,v])=>({e,avg:Math.round(v.total/v.count),count:v.count})).sort((a,b)=>b.avg-a.avg);
  const emEl=document.getElementById('emojis');
  if (!emEntries.length) { emEl.innerHTML='<div class="empty">2+ uses needed.</div>'; }
  else { emEl.innerHTML=`<div class="kw-grid">${emEntries.map(k=>`<span class="kw ${k.avg>overallAvg?'good':'bad'}" title="${k.count} posts · ${k.avg} avg">${k.e} <span style="opacity:.6">${k.avg}</span></span>`).join('')}</div>`; }

  // Standout
  const best = [...monthRows].filter(r=>num(r['upvotes'])!==null).sort((a,b)=>num(b['upvotes'])-num(a['upvotes']))[0];
  const stEl = document.getElementById('standout');
  if (!best) { stEl.innerHTML='<div class="empty">No data yet.</div>'; }
  else {
    const link = best['post link'] ? `<a href="${best['post link']}" target="_blank" style="color:#5a7aaa;font-size:10px;text-decoration:none">↗ view post</a>` : '';
    stEl.innerHTML=`<div class="standout-val">${num(best['upvotes'])} upvotes</div>
      <div class="standout-sub">${best['subreddit']} · ${best['date']} · ${link}</div>
      <div class="standout-cap">${best['caption']||best['clip title']||'—'}</div>`;
  }

  document.getElementById('last-updated').textContent = new Date().toLocaleDateString('en-US',{month:'short',year:'numeric'});
}

async function load() {
  try {
    const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(CSV_URL));
    render(parseCSV(await res.text()));
  } catch(e) {
    document.getElementById('last-updated').textContent = 'Error loading data';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
